name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run these same checks before publishing an image.
  workflow_call:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that is still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # setup-dotnet's built-in cache needs packages.lock.json files, which this repo
      # does not have, so the NuGet folder is cached by hand, keyed on the .csproj files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ExcludeSpaClient=true drops the reference to the React .esproj, so this job
      # needs no Node/npm (the client has its own job). The solution is not built
      # for the same reason.
      - name: Restore
        run: dotnet restore DotaAnalyst.Tests -p:ExcludeSpaClient=true

      - name: Test
        run: dotnet test DotaAnalyst.Tests -c Release --no-restore -p:ExcludeSpaClient=true

      # Fails when any NuGet package (direct or indirect) has a known vulnerability, so we hear about it
      # here instead of only through a Visual Studio warning. Package lines in the report start with ">".
      # pipefail: if "dotnet list" itself fails, the step fails too (otherwise tee's success would hide it
      # and the check would silently pass).
      # "dotnet list" has no -p option; MSBuild reads environment variables as properties instead.
      - name: Vulnerable packages
        shell: bash
        env:
          ExcludeSpaClient: "true"
        run: |
          set -o pipefail
          dotnet list DotaAnalyst.Tests package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q '^ *>' vulnerable.txt; then exit 1; fi

  client:
    name: React lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotaanalyst.client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dotaanalyst.client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  go:
    name: Go replay parser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replay-parser
    steps:
      - uses: actions/checkout@v7

      # The Go version comes from go.mod ("go 1.27.2"), the same one the Dockerfile builds with.
      - uses: actions/setup-go@v7
        with:
          go-version-file: replay-parser/go.mod
          cache-dependency-path: replay-parser/go.sum

      # gofmt -l lists badly formatted files and still exits 0, so an empty list is checked by hand.
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # Pinned to a master commit: the latest release (v0.8.1) cannot read Go 1.27.2's export data ("version 5 is
      # greater than maximum supported version 4"). Go back to a release tag once one supports it.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 ./...

      # The real-replay tests skip themselves: the replay is not in the repository.
      - run: go test ./...

      - name: Replay lifecycle race checks
        run: go test -race ./internal/parsing ./internal/httpapi

      - name: Bounded URL fuzzing
        run: go test ./internal/valve -run '^$' -fuzz '^FuzzReplayURL$' -fuzztime=5s -parallel=2

      # Like "Vulnerable packages" in the .NET job, but only for code we actually call (standard library
      # included: a Go patch release with security fixes means bumping "go" in go.mod and the Dockerfile).
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the Dockerfile still builds; nothing is pushed.
      # type=gha stores the layers in the GitHub Actions cache, so unchanged
      # stages (npm ci, dotnet restore) are reused between runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Go replay parser image (docker-compose.yml builds it from ./replay-parser). Its own cache scope,
      # so the two images don't overwrite each other's layers.
      - uses: docker/build-push-action@v7
        with:
          context: replay-parser
          push: false
          cache-from: type=gha,scope=replay-parser
          cache-to: type=gha,mode=max,scope=replay-parser
