name: Coach ML

on:
  push:
    paths: ["coach-ml/**", ".github/workflows/coach-ml.yml"]
  pull_request:
    paths: ["coach-ml/**", ".github/workflows/coach-ml.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The risk extra (scikit-learn, CPU) so the death-risk model tests run too; the train extra (GPU) stays out.
      - run: python -m pip install -c coach-ml/constraints-risk.txt "./coach-ml[risk]"
      # Lint of the prediction-model code (scope in coach-ml/pyproject.toml, [tool.ruff]).
      - run: python -m pip install ruff==0.6.9
      - run: ruff check coach-ml
      - run: python -B -m unittest discover -s coach-ml/tests -v
      - run: coach-ml --help
