[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dotaanalyst-coach-ml"
version = "0.1.0"
description = "Local datasets, curation, auditing and training for the DotaAnalyst coach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
tokenizer = ["transformers==4.56.2"]
risk = ["scikit-learn==1.5.2"]
train = ["torch==2.8.0", "transformers==4.56.2", "peft==0.17.1", "safetensors==0.8.0", "accelerate==1.10.1"]

[project.scripts]
coach-ml = "coach_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Expand checks incrementally; untouched legacy modules retain their existing style.
[tool.ruff]
line-length = 120
target-version = "py311"
# coach_ml is first-party (src layout): imports are grouped as standard library, then the project.
src = ["src", "tests"]
include = ["src/coach_ml/risk/**/*.py", "tests/test_risk_*.py", "tests/test_next_region.py", "tests/test_position_measure.py"]
extend-include = [
  "src/coach_ml/core/**/*.py", "src/coach_ml/runtime/ports.py", "src/coach_ml/runtime/generation.py",
  "src/coach_ml/lora.py", "src/coach_ml/runtime_qwen35/audit.py",
  "src/coach_ml/tactical/target_rendering.py", "src/coach_ml/tactical/policy_v2.py",
  "src/coach_ml/tactical/policy_v3.py", "src/coach_ml/tactical/content_diagnostics.py",
  "src/coach_ml/tactical/error_analysis.py", "src/coach_ml/tactical/supervision_audit.py",
  "tests/test_architecture.py", "tests/test_audit_infrastructure.py", "tests/test_generation_composition.py",
  "tests/test_target_rendering.py",
]

[tool.ruff.lint]
# pyflakes (unused/undefined names), import order, bugbear (likely bugs).
select = ["F", "I", "B"]
