[build-system]
requires = ["setuptools>=79.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotaanalyst-coach-ml"
version = "0.1.0"
description = "Local datasets, curation, auditing and training for the DotaAnalyst coach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
tokenizer = ["transformers==4.56.2"]
train = ["torch==2.8.0", "transformers==4.56.2", "peft==0.17.1", "safetensors==0.8.0", "accelerate==1.10.1"]

[project.scripts]
coach-ml = "coach_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
