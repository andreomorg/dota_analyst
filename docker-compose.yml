# Runs the whole project: docker compose up --build
# Settings come from a .env file next to this one (copy .env.example); POSTGRES_PASSWORD and REPLAY_PARSER_API_KEY
# are required.

services:
  api:
    build: .
    image: dotaanalyst-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "db" is the database service's name: containers of the same compose project reach each other by name.
      # Timeout=5: give up connecting after 5 s (default 15) when the database is down.
      ConnectionStrings__Database: "Host=db;Port=5432;Database=dotaanalyst;Username=dotaanalyst;Timeout=5;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file (see .env.example)}"
      # Optional: Steam Web API key for names/avatars of logged-in users (empty = not shown).
      Steam__ApiKey: "${STEAM_API_KEY:-}"
      # Replay parser (Go service below), reached by its service name inside the compose network, with its token.
      ReplayParser__BaseUrl: "http://replay-parser:8081/"
      ReplayParser__ApiKey: "${REPLAY_PARSER_API_KEY}"
      # This machine keeps the raw replay documents (replay_documents); production (Render) doesn't.
      ReplayParser__KeepDocuments: "true"
      # The game's own files of each build (abilities, items, heroes) for the matches' patch: synchronized on this
      # machine only (production reads the current OpenDota catalogs). GITHUB_TOKEN (optional, a SECRET) raises
      # GitHub's limit from 60 to 5,000 calls an hour.
      GameData__SyncEnabled: "${GAME_DATA_SYNC:-true}"
      GameData__GitHubToken: "${GITHUB_TOKEN:-}"
      Maintenance__Enabled: "${MAINTENANCE_ENABLED:-false}"
      Maintenance__ApiKey: "${MAINTENANCE_API_KEY:-}"
      CoachMl__Enabled: "${COACH_ML_ENABLED:-false}"
      CoachMl__BaseUrl: "http://coach-ml:8090/"
      CoachMl__ApiKey: "${COACH_ML_API_KEY:-}"
    # No depends_on replay-parser on purpose: the API must work without it (replay-derived analysis is
    # unavailable). The parser supplies whole-match laning, timeline, maps, metrics and comparison-base data;
    # waiting for its health check would let a broken parser keep the whole site down.
    depends_on:
      # Waits for PostgreSQL to accept connections (its health check), not just for its container to start.
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Collector of the comparison base (pro and high-rank matches): all the heavy work happens on this machine. It
  # parses matches with the replay parser here, keeps the raw base in the LOCAL database, and every hour publishes
  # only the finished base (each hero/role's distributions, a few MB) to the local site and to the production mirror
  # (Neon). The API's image with Collector__Enabled, no port. Only with the "collector" profile: COMPOSE_PROFILES in
  # .env, or "docker compose up -d collector". OpenDota is called from this machine's IP (not the site's quota).
  collector:
    image: dotaanalyst-api
    profiles: [collector]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The raw base: the same local database as the "api" service (which migrates it).
      ConnectionStrings__Database: "Host=db;Port=5432;Database=dotaanalyst;Username=dotaanalyst;Timeout=5;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file (see .env.example)}"
      Database__MigrateOnStartup: "false"
      # The production mirror (Neon) for the finished base, in .NET format; empty = only the local site gets it.
      # Neon's schema is migrated by the Render deploy, never from here.
      ConnectionStrings__Mirror: "${MIRROR_DATABASE:-}"
      ReplayParser__BaseUrl: "http://replay-parser:8081/"
      ReplayParser__ApiKey: "${REPLAY_PARSER_API_KEY}"
      ReplayParser__KeepDocuments: "true"
      Collector__Enabled: "true"
      Collector__DailyLimit: "${COLLECTOR_DAILY_LIMIT:-600}"
      # The account whose heroes the high-rank matches must have (0 = none: only pro matches).
      Collector__FocusAccountIds__0: "${COLLECTOR_FOCUS_ACCOUNT_ID:-0}"
      # High-rank matches wanted of each hero of the account's last 20 matches; until then they come first.
      Collector__TargetMatchesPerHero: "${COLLECTOR_TARGET_PER_HERO:-10}"
    depends_on:
      db:
        condition: service_healthy
      replay-parser:
        condition: service_healthy
    restart: unless-stopped
  # Explicit batch: docker compose run --rm refresh. Inputs and resumable output live under work/.
  refresh:
    image: python:3.12.15-slim
    profiles: [refresh]
    command: ["python", "-B", "/tools/replay-refresh/refresh.py"]
    environment:
      MAINTENANCE_API_KEY: "${MAINTENANCE_API_KEY:-}"
      COACH_ML_API_KEY: "${COACH_ML_API_KEY:-}"
      MATCH_IDS: "${MATCH_IDS:-/work/replay-refresh/match-ids.txt}"
      LOG: "${REPLAY_REFRESH_LOG:-/work/replay-refresh/refresh-log.jsonl}"
      WORKERS: "${REFRESH_WORKERS:-1}"
      PREFETCH_WORKERS: "${PREFETCH_WORKERS:-0}"
      PREFETCH_AHEAD: "${PREFETCH_AHEAD:-12}"
    volumes:
      - ./tools/replay-refresh:/tools/replay-refresh:ro
      - ./work:/work
    depends_on:
      api:
        condition: service_healthy
    restart: "no"


  coach-ml:
    build:
      context: ./coach-ml
      target: service
    image: dotaanalyst-coach-ml
    profiles: [coach-ml]
    environment:
      COACH_ML_API_KEY: "${COACH_ML_API_KEY:-}"
      COACH_ML_CALLBACK_URL: "http://api:8080/"
      COACH_ML_CALLBACK_KEY: "${COACH_ML_API_KEY:-}"
      COACH_ML_ENGINE: "${COACH_ML_ENGINE:-policy-preview}"
      COACH_ML_OLLAMA_URL: "${COACH_ML_OLLAMA_URL:-http://host.docker.internal:11434/}"
      COACH_ML_MODEL: "${COACH_ML_MODEL:-qwen3:8b}"
    # Internal network only. Neither the browser nor the public internet calls this port.
    cpus: 1
    mem_limit: 256m
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dotaanalyst
      POSTGRES_USER: dotaanalyst
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file (see .env.example)}"
    volumes:
      # Named volume: the data survives "docker compose down" (only "down -v" deletes it).
      - db-data:/var/lib/postgresql/data
    ports:
      # Only on this machine (127.0.0.1), for running the API with F5 and for pgAdmin. Not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotaanalyst -d dotaanalyst"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Go service that reads the whole replay: laning, timeline, maps, metrics and comparison-base data (replay-parser/).
  # Called only by the API (and, in production,
  # through the ngrok tunnel below), never by the browser.
  replay-parser:
    build: ./replay-parser
    image: dotaanalyst-replay-parser
    # No "ports:" on purpose: only containers of this compose project reach it (http://replay-parser:8081).
    environment:
      # Bearer token the API sends. Required: the parser downloads files on request, so it must not run open.
      REPLAY_PARSER_API_KEY: "${REPLAY_PARSER_API_KEY:?Set REPLAY_PARSER_API_KEY in the .env file (see .env.example)}"
      # The local API and, through the tunnel, the production API share this parser: one parse (~80 MB, ~2 s)
      # each, so neither gets "busy" because of the other.
      # Raise both for a batch re-parse (e.g. REPLAY_PARSER_MAX_PARSES=4 and REPLAY_PARSER_MEMORY=2g in the shell or .env).
      MAX_CONCURRENT_PARSES: "${REPLAY_PARSER_MAX_PARSES:-2}"
      REPLAY_CACHE_DIR: /cache
      MAX_CONCURRENT_PREFETCHES: "${REPLAY_PARSER_MAX_PREFETCHES:-4}"
      REPLAY_CACHE_MAX_BYTES: "${REPLAY_CACHE_MAX_BYTES:-4294967296}"
    volumes:
      - replay-cache:/cache
    # A corrupt replay can make the parser allocate a lot (manta trusts sizes written in the file) and Go's
    # out-of-memory is fatal: the limits make it kill only this container, which restarts.
    mem_limit: ${REPLAY_PARSER_MEMORY:-1g}
    pids_limit: 100
    healthcheck:
      # The image has no shell or curl; the binary checks its own /health.
      test: ["CMD", "/replay-parser", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # It handles URLs from outside: no writable filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # ngrok tunnel: gives the parser a public HTTPS address so the API on Render can reach it on this machine
  # (outbound connection only: no router port is opened). Only starts with the "tunnel" profile:
  # COMPOSE_PROFILES=tunnel in .env, or "docker compose up -d tunnel" (starts the parser too).
  tunnel:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: [tunnel]
    # The variables are checked here, not with ${VAR:?} (compose would then demand them even without the profile).
    # Without NGROK_URL ngrok would pick a random address the API on Render doesn't know, so it refuses to start.
    # --inspect=false: ngrok's request inspector would keep recent requests, Authorization header included.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$NGROK_URL" && test -n "$$NGROK_AUTHTOKEN" ||
        { echo "Set NGROK_URL and NGROK_AUTHTOKEN in the .env file (see .env.example)"; exit 1; };
        exec ngrok http replay-parser:8081 --url "$$NGROK_URL" --inspect=false --log stdout --log-format json
    environment:
      NGROK_URL: "${NGROK_URL:-}"
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    depends_on:
      replay-parser:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  db-data:
  replay-cache:
