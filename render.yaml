# Render Blueprint describing the production service, kept in sync with what exists on Render
# (service "dotaanalyst", created through the Render MCP). Free plan: no credit card, sleeps after
# 15 min without traffic. Render builds the root Dockerfile from the main branch.
# Auto-deploy is off: .github/workflows/release.yml calls the deploy hook when a v* tag is pushed,
# so the site only changes on releases, not on every push to main.
services:
  - type: web
    name: dotaanalyst
    runtime: docker
    repo: https://github.com/andreomorg/dota_analyst
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: off
    # Closest to Brazil among Render's regions; the production database (Neon) should use us-east-1 too.
    region: virginia
    healthCheckPath: /api/health
    envVars:
      # Render routes traffic to $PORT (10000 by default); the image listens on 8080.
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # HTTPS ends at Render's proxy: trust the forwarded headers (real client IP and scheme).
      - key: ForwardedHeaders__Enabled
        value: "true"
      # Requests go Cloudflare -> Render load balancer -> local proxy -> app, and X-Forwarded-For keeps
      # whatever the client sent. CF-Connecting-IP is overwritten by Cloudflare with the real client IP
      # (verified 2026-10-11 with Diagnostics__LogForwardedHeaders).
      - key: ForwardedHeaders__ForwardedForHeaderName
        value: CF-Connecting-IP
